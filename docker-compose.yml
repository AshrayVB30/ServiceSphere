# ==============================================================================
# ServiceSphere - Multi-Container Docker Orchestration
# Services: Frontend (Nginx SPA), Backend (Gunicorn), Database (PostgreSQL 16),
#           Cache & Broker (Redis 7), Background Tasks (Celery), Gateway (Nginx)
# ==============================================================================

name: servicesphere

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend - React Single-Page Application (SPA)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: servicesphere-frontend:latest
    container_name: servicesphere-frontend
    restart: unless-stopped
    networks:
      - servicesphere-network

  # ----------------------------------------------------------------------------
  # 2. Backend - Django REST Framework WSGI API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: servicesphere-backend:latest
    container_name: servicesphere-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-servicesphere-production-secret-key-change-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx,frontend}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-servicesphere_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-servicesphere_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - servicesphere-network

  # ----------------------------------------------------------------------------
  # 3. Database - PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: servicesphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-servicesphere_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servicesphere_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-servicesphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicesphere-network

  # ----------------------------------------------------------------------------
  # 4. Redis - Cache & Celery Task Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: servicesphere-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - servicesphere-network

  # ----------------------------------------------------------------------------
  # 5. Celery Worker - Asynchronous Task Processor
  # ----------------------------------------------------------------------------
  celery:
    image: servicesphere-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicesphere-celery
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-servicesphere-production-secret-key-change-in-production}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-servicesphere_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-servicesphere_password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - servicesphere-network

  # ----------------------------------------------------------------------------
  # 6. Gateway - Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: servicesphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - servicesphere-network

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  servicesphere-network:
    driver: bridge
