name: ServiceSphere CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend CI: Linting, Checks, Migrations & 147 Unit/Integration Tests
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Python 3.12 & PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: servicesphere_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-servicesphere-enterprise
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_NAME: servicesphere_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System & Model Checks
        run: |
          python manage.py check

      - name: Apply Database Migrations
        run: |
          python manage.py migrate --noinput

      - name: Seed KB Categories & Demo Verification
        run: |
          python manage.py seed_kb_categories
          python manage.py seed_demo_users
          python manage.py publish_all_articles

      - name: Execute Automated Test Suite (147 Tests)
        run: |
          python manage.py test --verbosity=2

  # ---------------------------------------------------------------------------
  # 2. Frontend CI: Dependency Install & Vite Production Build
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Node 22 & Vite 6)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          npm ci

      - name: Build Vite Production Assets
        run: |
          npm run build

  # ---------------------------------------------------------------------------
  # 3. Docker Orchestration: Compose Spec & Multi-Container Build Validation
  # ---------------------------------------------------------------------------
  docker-build-verification:
    name: Docker Build & Compose Spec Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build All Container Images
        run: |
          docker compose build --parallel

